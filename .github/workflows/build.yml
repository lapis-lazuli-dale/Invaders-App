name: Build Kivy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip *.zip
        if [ -f "*/main.py" ]; then mv */* . 2>/dev/null || true; fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Android Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good cmake openjdk-17-jdk unzip pkg-config autoconf automake libtool ccache
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Create Buildozer Config
      run: |
        buildozer init
        # This line automatically configures your Kivy libraries (kivy, kivymd, pillow)
        sed -i 's/^requirements = .*/requirements = python3, kivy==2.3.0, kivymd==1.2.0, pillow/' buildozer.spec
        sed -i 's/^android.archs = .*/android.archs = arm64-v8a/' buildozer.spec

    - name: Build APK
      run: |
        mkdir -p ~/.android && touch ~/.android/repositories.cfg
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: game-apk
        path: bin/*.apk
        
